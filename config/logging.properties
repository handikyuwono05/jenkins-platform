# JVM logging for the Jenkins controller.
#
# Everything goes to stdout in a single, parseable line format so that the
# container runtime is the only log transport (no in-container log files to
# rotate, lose, or forget to mount). Ship stdout to Cloud Logging / ELK and
# parse on the leading ISO-8601 timestamp.
#
# Format: <ISO-8601 timestamp> [LEVEL] [source] message
handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tFT%1$tT.%1$tL%1$tz [%4$s] [%3$s] %5$s%6$s%n

# Keep the boot-time story of "did my configuration actually apply" visible.
io.jenkins.plugins.casc.level = INFO

# Authentication and authorisation decisions: the signals you need when a
# login is rejected, and the evidence trail for access reviews.
org.jenkinsci.plugins.googlelogin.level = INFO
hudson.security.level = INFO
jenkins.security.level = INFO
hudson.plugins.audit_trail.level = INFO

# Winstone's own request handling is noisy at FINE and offers little value.
winstone.level = WARNING
